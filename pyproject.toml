[project]
name = "paper-doi-mcp"
dynamic = ["version"]
description = "MCP server that resolves and verifies DOIs and book editions, and searches the scholarly literature across open indexes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "graph-ist" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "doi", "citations", "crossref", "openalex", "bibliography", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["mcp[cli]>=1.2.0,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/graph-ist/doi-mcp"
Issues = "https://github.com/graph-ist/doi-mcp/issues"
Changelog = "https://github.com/graph-ist/doi-mcp/blob/main/CHANGELOG.md"

[project.scripts]
paper-doi-mcp = "paper_doi_mcp.server:main"
paper-doi-weekly = "paper_doi_mcp.weekly:main"
paper-doi-semantic = "paper_doi_mcp.semantic:main"
paper-doi-philarchive = "paper_doi_mcp.philarchive:main"

[project.optional-dependencies]
semantic = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "paper_doi_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["paper_doi_mcp"]

[tool.hatch.build.targets.sdist]
include = ["paper_doi_mcp/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pytest>=8",
]
