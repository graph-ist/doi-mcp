[project]
name = "paper-doi-mcp"
version = "0.8.1"
description = "MCP server that resolves and verifies DOIs and book editions, and searches the scholarly literature across open indexes"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
paper-doi-mcp = "server:main"

[project.optional-dependencies]
semantic = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "maps.py", "knowledge.py", "patents.py", "matching.py", "corpus.py", "philarchive.py", "weekly.py", "semantic.py"]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pytest>=8",
]
